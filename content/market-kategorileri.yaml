# Market kategorileri.
#
# kind: ilanda hangi alanların zorunlu olduğunu belirler
#   ekipman → makine ve cihazlar (durum, marka, model, yıl, çalışma saati önerilir)
#   parca   → yedek parça
#   hizmet  → hizmet ilanları
#   cevher  → cevher ve ürün; ilanda "ore" bloğu (mineral, tenör dayanağı) ZORUNLU
#   saha    → saha ve ruhsat; ilanda "license" bloğu (grup, ruhsat türü, teklif) ZORUNLU
# notice: kategori sayfasında ve bu kategorideki her ilanda gösterilen yasal/güvenlik notu.
#   Mevzuata dayanan cümleler sources ile kaynağa bağlanır (content/kaynaklar.yaml).

- slug: is-makineleri
  name: İş makineleri
  description: Ekskavatör, loder, dozer, greyder, kaya kamyonu ve damperli araçlar; satılık, kiralık ve aranan.
  icon: truck
  order: 1
  kind: ekipman

- slug: kirma-eleme
  name: Kırma-eleme ve tesis ekipmanı
  description: Konkasör, elek, değirmen, bant konveyör, mobil kırıcı ve komple cevher hazırlama tesisleri.
  icon: factory
  order: 2
  kind: ekipman

- slug: sondaj-delme
  name: Sondaj ve delici makineler
  description: Karotlu sondaj makineleri, delici makineler, kompresörler, delme takımları ve sondaj ekipmanı.
  icon: drill
  order: 3
  kind: ekipman

- slug: yeralti-ekipmanlari
  name: Yeraltı ekipmanları
  description: Tahkimat malzemeleri, havalandırma fanları, lokomotif, vagon, yeraltı yükleyicileri ve kuyu ekipmanı.
  icon: pickaxe
  order: 4
  kind: ekipman

- slug: isg-ekipmanlari
  name: İSG ve ölçüm ekipmanları
  description: Gaz ölçüm cihazları, ferdi kurtarıcılar, kişisel koruyucu donanım ve saha ölçüm cihazları.
  icon: hard-hat
  order: 5
  kind: ekipman
  notice:
    title: Güvenlik ekipmanında belge ve kalibrasyon kontrolü
    text: Gaz ölçüm cihazı, ferdi kurtarıcı ve kişisel koruyucu donanım alırken üreticinin uygunluk belgelerini, cihazın kalibrasyon kayıtlarını ve son kullanma tarihini isteyin. İkinci el güvenlik ekipmanı, yetkili servis veya akredite bir kalibrasyon laboratuvarı uygunluğunu doğrulamadan sahada kullanılmamalıdır.

- slug: laboratuvar-cihazlari
  name: Laboratuvar cihazları
  description: Numune hazırlama, kimyasal ve mineralojik analiz, kaya mekaniği deney cihazları.
  icon: microscope
  order: 6
  kind: ekipman

- slug: yedek-parca
  name: Yedek parça
  description: İş makinesi ve tesis yedek parçaları, aşınma parçaları, elek telleri, konveyör bantları ve rulolar.
  icon: cog
  order: 7
  kind: parca

- slug: hizmetler
  name: Hizmetler
  description: Sondaj, patlatma, dekapaj, nakliye, analiz, harita–ölçüm, bakım-onarım ve danışmanlık hizmetleri.
  icon: wrench
  order: 8
  kind: hizmet
  notice:
    title: Patlatma hizmetleri ve patlayıcı madde ilanları
    text: Patlatma, mevzuatta tanımlanan yetki ve sorumluluklar çerçevesinde, patlayıcı madde kullanılması koşullarını yerine getirmek üzere yeterlik belgesine sahip ateşleyicilerce yürütülür. Maden360'ta patlayıcı madde, kapsül, fünye, infilaklı fitil ve benzeri malzemelerin alım-satım ilanları kabul edilmez; yalnızca yetkili firmaların hizmet ilanları yayımlanır.
    sources:
      - id: maden-isg-yonetmeligi-2013
        locator: Madde 4 (b)
        note: Ateşleyici tanımı.

- slug: cevher-urun
  name: Cevher ve ürün
  description: Cevher, konsantre, endüstriyel hammadde, doğal taş blok ve ürün alım-satımı.
  icon: gem
  order: 9
  kind: cevher
  notice:
    title: Tenör beyanı ve analiz
    text: Tenör ve kalite bilgileri ilan sahibinin beyanıdır; ilanda beyanın dayanağı (akredite laboratuvar analizi, laboratuvar analizi, beyan veya analiz yok) ayrıca gösterilir. Satın almadan önce temsilî numune alarak akredite bir laboratuvarda analiz yaptırmanızı öneririz. Ruhsatsız üretildiği anlaşılan maden ilanları yayımlanmaz.

- slug: saha-ruhsat
  name: Saha, ruhsat ve rödövans
  description: Ruhsatlı saha devri, rödövans ve ortaklık ilanları; maden grubu, ruhsat türü ve rezerv dayanağıyla.
  icon: map
  order: 10
  kind: saha
  notice:
    title: Ruhsat devri ve rödövans mevzuata tabidir
    text: Maden Yönetmeliği'ne göre ruhsat devri; Bakanlık onayının alınması, tüm teknik belgelerin sunulması, mali yükümlülüklerin yerine getirilmesi ve devrin maden siciline şerh edilmesiyle tamamlanır; işletme izni ruhsattan bağımsız olarak devredilemez. Ruhsat sahipleri ile üçüncü kişiler arasındaki rödövans sözleşmeleri Genel Müdürlüğün iznine tabidir ve kamu kurum ve kuruluşları ile iştirakleri dışında yer altı kömür sahalarında rödövans sözleşmesi yapılamaz. Bir ilan, devrin veya sözleşmenin mümkün olduğu anlamına gelmez; işlemden önce ruhsatın maden sicilindeki kaydını ve hukuki durumunu doğrulayın, hukuki destek alın.
    sources:
      - id: maden-yonetmeligi-2022
        locator: Madde 79 (1) ve (10); Madde 97; Madde 101 (1) ve (4)
        note: Ruhsat devri, işletme izninin devredilemezliği, maden sicilinin açıklığı ve rödövans sözleşmeleri.
